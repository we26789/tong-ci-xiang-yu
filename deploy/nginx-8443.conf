# 同词相遇 · Mind Meld —— 独立端口入口
#
# 只监听 8443，与 443 上的协作平台完全隔离：
#   - 不改动 120.77.201.3.conf / 120.77.201.3.https.conf
#   - 复用同一个 IP 证书（证书绑定主机，与端口无关）
#   - 后端服务只监听回环 127.0.0.1:41731，由本机 Nginx 转发
server
{
    listen 8443 ssl;
    server_name 120.77.201.3;

    ssl_certificate     /opt/tong-ci-xiang-yu/ops/letsencrypt/live/tong-ci-xiang-yu-ip/fullchain.pem;
    ssl_certificate_key /opt/tong-ci-xiang-yu/ops/letsencrypt/live/tong-ci-xiang-yu-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:TCXYSSL:10m;
    ssl_session_timeout 10m;

    # 游戏请求体上限为 4096 字节，这里再收紧一道
    client_max_body_size 4k;

    access_log /www/wwwlogs/tong-ci-xiang-yu.8443.log;
    error_log  /www/wwwlogs/tong-ci-xiang-yu.8443.error.log;

    location / {
        proxy_pass http://127.0.0.1:41731;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        # 房间同步使用 20 秒长轮询，读超时必须大于它
        proxy_read_timeout    75s;
        proxy_send_timeout    75s;
        proxy_buffering       off;

        # 协作平台在 443 上显式把 HSTS 设为 max-age=0，
        # 这里抹掉游戏服务自带的 HSTS，避免覆盖同一主机上 443 的意图。
        proxy_hide_header Strict-Transport-Security;
    }
}
