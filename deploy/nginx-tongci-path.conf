# Include inside the existing HTTP and HTTPS site server blocks.
# The original site's root, assets and /api/ remain under its existing locations.
location = /tongci {
    return 308 https://$host/tongci/;
}

location ^~ /tongci/ {
    if ($scheme = http) { return 308 https://$host$request_uri; }
    client_max_body_size 8k;
    proxy_pass http://127.0.0.1:41731;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_connect_timeout 10s;
    proxy_read_timeout 35s;
    proxy_send_timeout 15s;
    proxy_hide_header Strict-Transport-Security;
}
